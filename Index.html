<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wow ลูกชิ้นทอด</title>

<style>

body{
font-family:sans-serif;
padding:20px;
background:#fff3ea;
}

button{
padding:12px;
font-size:16px;
margin:5px 0;
width:100%;
background:#ff6a00;
color:white;
border:none;
border-radius:8px;
}

.card{
background:white;
padding:10px;
margin-top:10px;
border-radius:10px;
}

</style>

</head>

<body>

<h1>🍢 Wow ลูกชิ้นทอด</h1>

<div id="menu"></div>

<button onclick="addMenu()">เพิ่มเมนู</button>

<h2>ยอดขายวันนี้</h2>

<div class="card">

ขายไป <span id="sold">0</span> ไม้

<br><br>

เงิน <span id="money">0</span> บาท

</div>

<script>

let price=10

let items = JSON.parse(localStorage.getItem("items")) || [

{name:"ลูกชิ้นปลา",stock:20,sold:0},
{name:"ไส้กรอกแดง",stock:20,sold:0}

]

function save(){

localStorage.setItem("items",JSON.stringify(items))

}

function render(){

let html=""

items.forEach((i,index)=>{

html+=`

<div class="card">

<b>${i.name}</b>

<br>

เหลือ ${i.stock}

<br><br>

<button onclick="sell(${index})">ขาย +1</button>

</div>

`

})

menu.innerHTML=html

update()

}

function sell(i){

items[i].stock--

items[i].sold++

save()

render()

}

function addMenu(){

let name = prompt("ชื่อเมนู")

items.push({

name:name,
stock:20,
sold:0

})

save()

render()

}

function update(){

let total=0

items.forEach(i=>{

total+=i.sold

})

sold.innerText=total

money.innerText=total*price

}

render()

</script>

</body>
</html>
